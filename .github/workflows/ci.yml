name: Windows CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Scan Git history for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run audit:dependencies
      - run: bun run type-check
      - run: bun run lint
      - run: bun run test
      - run: bun run build
      - run: bun run test:release-contract

  validate-docker:
    name: Build and inspect Linux x64 container
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build Docker image
        run: docker build --platform linux/amd64 --tag opendeputy:ci .
      - name: Verify Docker legal inventory
        run: |
          docker run --rm --entrypoint sh opendeputy:ci -c '
            set -eu
            legal=/usr/share/licenses/opendeputy
            test -s "$legal/LICENSE"
            test -s "$legal/THIRD_PARTY_NOTICES.md"
            test -s "$legal/THIRD_PARTY_LICENSES.docker-linux-x64.txt"
            test -s "$legal/OPEN_SOURCE_COMPONENTS.md"
            test -s "$legal/third-party/OpenCode-1.18.18-LICENSE.txt"
            test -s "$legal/third-party/Apache-2.0-LICENSE.txt"
            grep -q "docker-linux-x64" "$legal/THIRD_PARTY_LICENSES.docker-linux-x64.txt"
            ! grep -q "^electron@" "$legal/THIRD_PARTY_LICENSES.docker-linux-x64.txt"
          '
      - name: Verify Docker server and browser runtime
        run: |
          set -eu
          cleanup() {
            docker logs opendeputy-ci-runtime || true
            docker rm --force opendeputy-ci-runtime || true
          }
          trap cleanup EXIT
          docker run --detach --name opendeputy-ci-runtime \
            --env OPENCHAMBER_UI_PASSWORD=ci-runtime-only \
            opendeputy:ci
          status=starting
          for attempt in $(seq 1 45); do
            status=$(docker inspect --format '{{.State.Health.Status}}' opendeputy-ci-runtime)
            if [ "$status" = healthy ]; then
              break
            fi
            if [ "$status" = unhealthy ]; then
              exit 1
            fi
            sleep 2
          done
          test "$status" = healthy
          docker exec opendeputy-ci-runtime node --input-type=module -e '
            import { createHeadlessBrowserRuntime } from "./packages/web/server/lib/browser-control/headless-runtime.js";
            const runtime = createHeadlessBrowserRuntime({ env: process.env, dataDir: "/tmp/opendeputy-ci-browser" });
            try {
              const opened = await runtime.request("browser.open", { url: "http://127.0.0.1:3000/health" });
              const snapshot = await runtime.request("browser.snapshot");
              if (opened.opened !== true || !snapshot.text.includes("status")) process.exitCode = 1;
            } finally {
              await runtime.stop();
            }
          '

  package-windows:
    name: Package Windows CI artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [secret-scan, validate, validate-docker]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - run: bun install --frozen-lockfile
      - run: bun run electron:build
      - run: bun run test:windows-package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OpenDeputy-Windows-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: |
            packages/electron/dist/OpenDeputy-*-win-*.exe
            packages/electron/dist/OpenDeputy-*-win-*.exe.blockmap
            packages/electron/dist/latest.yml
            packages/electron/dist/SHA256SUMS.txt
            LICENSE
            THIRD_PARTY_NOTICES.md
            THIRD_PARTY_LICENSES.txt
            docs/OPEN_SOURCE_COMPONENTS.md
            legal/third-party/**
