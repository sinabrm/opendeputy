name: Windows release candidate

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: Existing v-prefixed tag to attach to the draft release
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version_tag || github.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - run: bun install --frozen-lockfile
      - run: bun run release:prepare
      - run: bun run electron:build
      - run: bun run test:windows-package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OpenDeputy-Windows
          if-no-files-found: error
          path: |
            packages/electron/dist/OpenDeputy-*-win-*.exe
            packages/electron/dist/OpenDeputy-*-win-*.exe.blockmap
            packages/electron/dist/latest.yml
            packages/electron/dist/SHA256SUMS.txt
            LICENSE
            THIRD_PARTY_NOTICES.md
            THIRD_PARTY_LICENSES.txt
            docs/OPEN_SOURCE_COMPONENTS.md
            legal/third-party/**
      - name: Resolve release tag
        id: release-tag
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version_tag }}' } else { '${{ github.ref_name }}' }
          if ($tag -notmatch '^v\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') { throw "Invalid release tag: $tag" }
          "tag=$tag" >> $env:GITHUB_OUTPUT
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.release-tag.outputs.tag }}
          draft: true
          prerelease: true
          generate_release_notes: true
          files: |
            packages/electron/dist/OpenDeputy-*-win-*.exe
            packages/electron/dist/OpenDeputy-*-win-*.exe.blockmap
            packages/electron/dist/latest.yml
            packages/electron/dist/SHA256SUMS.txt
            LICENSE
            THIRD_PARTY_NOTICES.md
            THIRD_PARTY_LICENSES.txt
            docs/OPEN_SOURCE_COMPONENTS.md
            legal/third-party/*
